<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IterTrip · 行程地图</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #FAF6F0;
    --card: #FFFFFF;
    --ink: #2B2B28;
    --ink-soft: #6B6B64;
    --accent: #1F6B54;
    --accent-soft: #E3EFE8;
    --gold: #C8903C;
    --gold-soft: #F6EBD8;
    --line: #E8E0D4;
    --day-1: #E07A5F;
    --day-2: #E9B44C;
    --day-3: #3D8B8A;
    --day-4: #6D5B9E;
    --day-5: #B85C5C;
    --day-6: #4C7A3E;
    --shadow: 0 8px 30px rgba(43,43,40,.12);
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); }
  #map { position: fixed; inset: 0; z-index: 1; background: #dfe6dd; }

  /* ---------- 顶部悬浮标题 ---------- */
  #topbar {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 500;
    display: flex; align-items: center; gap: 12px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .brand {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 14px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow); font-weight: 700; letter-spacing: .3px;
  }
  .brand .logo { font-size: 18px; }
  .brand .name { font-size: 14px; }
  .brand .name small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 10px; letter-spacing: 1px; }
  .trip-title {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 16px;
    box-shadow: var(--shadow); min-width: 0; overflow: hidden;
  }
  .trip-title h1 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-title .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .trip-title .meta span + span::before { content: "·"; margin: 0 6px; color: #C9C2B4; }
  #toggle-panel {
    margin-left: auto; border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    color: var(--accent); cursor: pointer; box-shadow: var(--shadow);
    font-family: var(--font);
  }
  #toggle-panel:hover { background: var(--accent-soft); }

  /* ---------- 侧滑面板 ---------- */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: min(400px, calc(100vw - 96px));
    background: var(--bg); z-index: 400;
    box-shadow: -10px 0 40px rgba(43,43,40,.15);
    transform: translateX(0);
    transition: transform .32s cubic-bezier(.22,.8,.36,1);
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
  }
  #panel.collapsed { transform: translateX(calc(100% + 2px)); }
  #panel-scroll { flex: 1; overflow-y: auto; padding: 0 18px 40px; }

  /* ---------- 侧边栏横向拖拽手柄（左边缘，跨在左边框上） ---------- */
  .panel-resize {
    position: absolute; top: 0; bottom: 0; left: -6px; width: 13px;
    cursor: col-resize; touch-action: none; z-index: 3;
  }
  .panel-resize::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 3px;
    border-radius: 2px; background: var(--line);
    transition: background-color .15s ease;
  }
  .panel-resize:hover::before,
  .panel-resize:focus-visible::before,
  body.panel-dragging .panel-resize::before { background: var(--accent); }
  .panel-resize:focus-visible { outline: none; }
  body.panel-dragging { cursor: col-resize; user-select: none; -webkit-user-select: none; }
  body.panel-dragging #panel { transition: none; }
  body.panel-dragging .leaflet-container { pointer-events: none; }

  .day-block { margin-bottom: 26px; }
  .day-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 4px 10px; border-bottom: 2px solid var(--line);
    cursor: pointer; user-select: none;
  }
  .day-badge {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0;
  }
  .day-head h2 { font-size: 15px; font-weight: 700; flex: 1; }
  .day-head .theme { font-size: 12px; color: var(--ink-soft); font-weight: 400; display: block; margin-top: 1px; }
  .day-head .chev { color: var(--ink-soft); transition: transform .25s; font-size: 12px; }
  .day-block.closed .chev { transform: rotate(-90deg); }
  .day-body { overflow: hidden; transition: max-height .3s ease; max-height: 6000px; }
  .day-block.closed .day-body { max-height: 0; }

  .place-item {
    display: flex; gap: 10px; padding: 11px 52px 11px 4px;   /* 右侧留编辑+删除两个按钮位 */
    border-bottom: 1px dashed var(--line); cursor: pointer;
    transition: background .15s; border-radius: 8px; position: relative;
  }
  .place-item:hover { background: var(--card); }
  .place-item.active { background: var(--gold-soft); }
  .place-emoji {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: var(--card); border: 1px solid var(--line);
  }
  .place-info { flex: 1; min-width: 0; }
  .place-name { font-size: 14px; font-weight: 600; }
  .place-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.5; }
  .place-sub .tag {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    border-radius: 6px; padding: 0 6px; font-size: 11px; margin-right: 6px; margin-top: 2px;
  }

  /* ---------- 酒店卡片 ---------- */
  .hotel-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-top: 12px;
    box-shadow: 0 2px 10px rgba(43,43,40,.05);
  }
  .hotel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .hotel-head .pin { font-size: 16px; }
  .hotel-head h3 { font-size: 14px; font-weight: 700; flex: 1; }
  .hotel-note { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .price-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .price-table th {
    text-align: left; font-size: 11px; color: var(--ink-soft); font-weight: 600;
    padding: 6px 8px; border-bottom: 1px solid var(--line); text-transform: uppercase;
  }
  .price-table td { padding: 8px; border-bottom: 1px solid #F3EDE3; vertical-align: middle; }
  .price-table tr:last-child td { border-bottom: none; }
  .price-table .platform { font-weight: 600; }
  .price-table .amount { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .price-table tr.best { background: var(--gold-soft); }
  .price-table .best-tag {
    background: var(--gold); color: #fff; font-size: 10px; font-weight: 700;
    border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px;
  }
  .price-table .bf { font-size: 11px; color: var(--ink-soft); }
  .price-table .pd-note { font-size: 11px; color: var(--ink-soft); }

  .verdict { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .verdict .verdict-title { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .verdict p { font-size: 12.5px; line-height: 1.7; color: var(--ink-soft); }
  .book-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .book-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: 7px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: none; font-family: var(--font);
    transition: background .2s;
  }
  .book-btn:hover { background: #175740; }
  .book-btn .src { font-size: 10px; opacity: .7; }

  /* ---------- AI 建议 ---------- */
  #summary {
    background: var(--accent); color: #F4FBF6; border-radius: var(--radius);
    padding: 16px; margin: 6px 0 20px;
  }
  #summary h2 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  #summary ul { list-style: none; }
  #summary li {
    font-size: 12.5px; line-height: 1.75; padding-left: 16px; position: relative; margin-bottom: 4px;
  }
  #summary li::before { content: "✦"; position: absolute; left: 0; color: var(--gold); }
  #summary li b { color: #fff; }

  .panel-footer {
    padding: 14px 18px; border-top: 1px solid var(--line); background: var(--card);
    font-size: 11px; color: #A8A298; text-align: center;
  }

  /* ---------- 编辑器：工具条 ---------- */
  .toolbar { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .tb-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--accent);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: var(--font); transition: background .15s, opacity .15s;
  }
  .tb-btn:hover:not(:disabled) { background: var(--accent-soft); }
  .tb-btn:disabled { opacity: .35; cursor: default; }
  .tb-btn.tb-accent.active-mode { background: var(--gold); border-color: var(--gold); color: #fff; }
  .tb-btn.tb-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tb-btn.tb-primary:hover:not(:disabled) { background: #175740; }
  .tb-btn.tb-primary:disabled { opacity: .4; }
  .tb-sep { width: 1px; height: 16px; background: var(--line); }
  .footer-note { margin-top: 8px; }

  /* ---------- 编辑器：删除按钮（悬停显现，触屏常显） ---------- */
  .place-del {
    position: absolute; top: 9px; right: 4px;
    width: 20px; height: 20px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink-soft); font-size: 11px; line-height: 1;
    cursor: pointer; opacity: 0; transition: opacity .15s;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
  }
  .place-item:hover .place-del, .place-del:focus-visible { opacity: 1; }
  .place-del:hover { background: #F6E7E7; color: #B85C5C; border-color: #E0C3C3; }

  /* ---------- 编辑器：编辑按钮（与删除同款交互，位于删除左侧） ---------- */
  .place-edit {
    position: absolute; top: 9px; right: 28px;
    width: 20px; height: 20px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink-soft); font-size: 11px; line-height: 1;
    cursor: pointer; opacity: 0; transition: opacity .15s;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
  }
  .place-item:hover .place-edit, .place-edit:focus-visible { opacity: 1; }
  .place-edit:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  @media (hover: none) { .place-edit { opacity: .55; } }

  /* ---------- 编辑器：表单内「更改位置」行 ---------- */
  .af-repick-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ---------- 编辑器：拖拽占位与高亮 ---------- */
  .place-item.dragging { opacity: .35; }
  .drop-placeholder {
    border: 2px dashed var(--accent); border-radius: 8px; background: var(--accent-soft);
    color: var(--accent); font-size: 12px; font-weight: 600; text-align: center;
    padding: 9px 4px; margin: 4px 0;
  }
  .day-block.drop-target > .day-head { border-bottom-color: var(--accent); }
  .day-block.drop-target > .day-body { min-height: 48px; }

  /* ---------- 编辑器：选点模式提示 + 新增表单 ---------- */
  #pick-hint {
    display: none; position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
    z-index: 600; background: var(--gold); color: #fff; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow);
    white-space: nowrap;
  }
  body.picking #pick-hint { display: block; }
  body.picking .leaflet-container { cursor: crosshair !important; }
  body.picking .leaflet-marker-icon { pointer-events: none; }   /* 选点时标记不抢 click */

  #add-form-backdrop {
    display: none; position: fixed; inset: 0; z-index: 700;
    background: rgba(43,43,40,.35); align-items: center; justify-content: center;
  }
  #add-form-backdrop.open { display: flex; }
  #add-form {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; width: min(320px, calc(100vw - 48px));
    display: flex; flex-direction: column; gap: 10px;
  }
  #add-form h3 { font-size: 14px; }
  #add-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  #add-form input, #add-form select {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    font-size: 13px; font-family: var(--font); background: #fff; color: var(--ink);
  }
  #add-form input:focus, #add-form select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .af-pos { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .af-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- 图例 ---------- */
  #legend {
    position: fixed; bottom: 18px; left: 14px; z-index: 500;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font-size: 11px; color: var(--ink-soft);
    box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center;
  }
  #legend .lg { display: flex; align-items: center; gap: 4px; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* ---------- Leaflet 自定义标记 ---------- */
  .iter-pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.3); border: 2px solid #fff;
  }
  .iter-pin .e { transform: rotate(45deg); font-size: 14px; line-height: 1; }
  .iter-pin.hotel { background: var(--gold); }
  .iter-pin.day-1 { background: var(--day-1); }
  .iter-pin.day-2 { background: var(--day-2); }
  .iter-pin.day-3 { background: var(--day-3); }
  .iter-pin.day-4 { background: var(--day-4); }
  .iter-pin.day-5 { background: var(--day-5); }
  .iter-pin.day-6 { background: var(--day-6); }
  .iter-pin.active { box-shadow: 0 0 0 4px rgba(200,144,60,.45); }
  .iter-popup .pp-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .iter-popup .pp-row { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
  .leaflet-popup-content-wrapper { border-radius: 12px !important; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--ink) !important; }

  /* ---------- 当日有向路线：段中点箭头 + 流动动画 ---------- */
  .route-arrow-wrap {
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .route-arrow {
    display: block; width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 9px solid var(--rc, #1F6B54);
    filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff);
  }
  .route-flow {
    stroke-dasharray: 2 9 !important;
    stroke-width: 3.5px;
    opacity: .95;
    animation: routeFlow 1s linear infinite;
  }
  @keyframes routeFlow { to { stroke-dashoffset: -11px; } }
  @media (prefers-reduced-motion: reduce) {
    .route-flow { animation: none; }
  }

  /* ---------- Leaflet 控件（左上角，下移至标题栏下方；版权在左下） ---------- */
  .leaflet-top { top: 78px; }
  .leaflet-bar { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  .leaflet-bar a { color: var(--ink); }
  .leaflet-control-layers { border: 1px solid var(--line) !important; border-radius: 10px !important; box-shadow: var(--shadow) !important; }

  @media (max-width: 640px) {
    .brand .name small { display: none; }
    .trip-title h1 { font-size: 14px; }
    #toggle-panel { padding: 7px 11px; font-size: 12px; }
    #legend { display: none; }
  }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="topbar">
    <div class="brand">
      <span class="logo">🧭</span>
      <span class="name">IterTrip<small>LATIN · ITER · ROAD</small></span>
    </div>
    <div class="trip-title" id="tripTitle">
      <h1 id="ttTitle">—</h1>
      <div class="meta" id="ttMeta"></div>
    </div>
    <button id="toggle-panel">☰ 行程</button>
  </div>

  <div id="legend">
    <span class="lg"><span class="dot" style="background:var(--day-1)"></span>D1</span>
    <span class="lg"><span class="dot" style="background:var(--day-2)"></span>D2</span>
    <span class="lg"><span class="dot" style="background:var(--day-3)"></span>D3</span>
    <span class="lg"><span class="dot" style="background:var(--day-4)"></span>D4</span>
    <span class="lg"><span class="dot" style="background:var(--gold)"></span>酒店</span>
  </div>

  <aside id="panel">
    <div id="panel-resize" class="panel-resize" role="separator" aria-orientation="vertical" aria-label="拖动调整行程面板宽度" tabindex="0"></div>
    <div id="panel-scroll">
      <div id="summary"></div>
      <div id="timeline"></div>
    </div>
    <div class="panel-footer">
      <div class="toolbar" role="toolbar" aria-label="行程编辑工具条">
        <button id="btn-undo" class="tb-btn" type="button" title="撤销 (Ctrl+Z)">↩ 撤销</button>
        <button id="btn-redo" class="tb-btn" type="button" title="重做 (Ctrl+Shift+Z)">↪ 重做</button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button id="btn-add" class="tb-btn tb-accent" type="button" title="在地图上点选新增地点">📍 添加地点</button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button id="btn-export-json" class="tb-btn" type="button" title="导出 route JSON">⤓ JSON</button>
        <button id="btn-export-html" class="tb-btn" type="button" title="导出可继续编辑的 HTML">⤓ HTML</button>
      </div>
      <div class="footer-note">由 IterTrip · AI 生成行程 · 价格由用户手动提供</div>
    </div>
  </aside>

  <div id="pick-hint">📍 点击地图选择地点位置（Esc 取消）</div>

  <div id="add-form-backdrop">
    <div id="add-form" role="dialog" aria-label="新增地点">
      <h3 id="af-title">📍 新增地点</h3>
      <label>名称<input id="af-name" type="text" placeholder="地点名称（必填）" maxlength="60" /></label>
      <label>类型
        <select id="af-type">
          <option value="attraction">⛰️ 景点 attraction</option>
          <option value="food">🍜 美食 food</option>
          <option value="transport">🚇 交通 transport</option>
          <option value="other">📍 其他 other</option>
        </select>
      </label>
      <div id="af-day-wrap"><label>加入哪一天<select id="af-day"></select></label></div>
      <label>时间<input id="af-time" type="text" list="time-presets" placeholder="如 09:00-11:30（可选）" maxlength="40" /></label>
      <datalist id="time-presets">
        <option value="上午 09:00-12:00"></option>
        <option value="中午 12:00-14:00"></option>
        <option value="下午 14:00-17:00"></option>
        <option value="傍晚 17:00-19:00"></option>
        <option value="晚上 19:00-22:00"></option>
      </datalist>
      <label>交通<input id="af-transport" type="text" list="transport-presets" placeholder="如 地铁 3 号线（可选）" maxlength="60" /></label>
      <datalist id="transport-presets">
        <option value="步行"></option>
        <option value="地铁"></option>
        <option value="公交"></option>
        <option value="打车"></option>
        <option value="自驾"></option>
        <option value="景区直通车"></option>
      </datalist>
      <label>门票<input id="af-ticket" type="text" list="ticket-presets" placeholder="如 50 元（可选）" maxlength="40" /></label>
      <datalist id="ticket-presets">
        <option value="免费"></option>
        <option value="收费"></option>
      </datalist>
      <label>备注<input id="af-note" type="text" placeholder="可选" maxlength="120" /></label>
      <label id="af-repick-wrap" style="display:none">位置
        <span class="af-repick-row">
          <button id="af-repick" class="tb-btn" type="button">🗺 更改位置</button>
        </span>
      </label>
      <div class="af-pos" id="af-pos"></div>
      <div class="af-actions">
        <button id="af-cancel" class="tb-btn" type="button">取消</button>
        <button id="af-ok" class="tb-btn tb-primary" type="button" disabled>确定添加</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ 导出用纯净快照 ============
   必须在任何渲染/DOM 变更之前捕获。导出时若用实时 outerHTML，会把 Leaflet
   运行时生成的 pane/marker/popup 一起序列化——L.map() 初始化不清理容器子元素，
   导出文件再打开会出现旧图层残留叠加。对纯净快照做 TRIP 替换则始终干净。 */
const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
/* ============ 数据注入点 ============ */
const TRIP = __TRIP_DATA__;
/* ==================================== */

const DAY_COLORS = ['#E07A5F','#E9B44C','#3D8B8A','#6D5B9E','#B85C5C','#4C7A3E'];
const EMOJI = { attraction:'⛰️', food:'🍜', transport:'🚇', other:'📍' };
const EMOJI_FALLBACK = { attraction:'📍', food:'🍽️', transport:'🚌', other:'📍' };

/* 图例按实际天数动态生成 */
(function buildLegend(){
  const leg = document.getElementById('legend');
  const days = (TRIP.days||[]).length;
  const hotel = `<span class="lg"><span class="dot" style="background:var(--gold)"></span>酒店</span>`;
  let html = '';
  for (let i=0;i<days;i++){
    html += `<span class="lg"><span class="dot" style="background:${DAY_COLORS[i%6]}"></span>D${i+1}</span>`;
  }
  leg.innerHTML = html + hotel;
})();

/* ============ 地图初始化 ============ */
const map = L.map('map', { zoomControl: true, attributionControl: false, minZoom: 3 }).setView([34.05, 108.94], 5);

/* 默认瓦片：高德公共栅格瓦片（无需 key，国内加载快、中文标注）。
   想换回国外样式/或配官方高德 key，见 README「可选：高德瓦片」。 */
const amap = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  attribution: '&copy; 高德地图', subdomains: '1234', minZoom: 3, maxZoom: 18
});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', minZoom: 3, maxZoom: 19
});
amap.addTo(map);
/* 控件布局：顶部被标题栏占用 → 缩放/瓦片控件放左上角标题栏下方（右侧面板展开时不遮挡）；版权放左下 */
L.control.attribution({ position: 'bottomleft' }).addTo(map);
L.control.layers({ '高德（默认）': amap, 'OSM 标准': osm }, null, { position: 'topleft' }).addTo(map);

/* 编辑器重渲染容器：marker/casing/line/arrow 全部进这一层，clearLayers 一次清干净；
   瓦片与控件不在此层（它们不属于行程数据，重渲染不应重建） */
const mapLayers = L.layerGroup().addTo(map);


/* ============ 渲染 ============ */
let markers = {};         // key -> L.marker（编辑器 rerender 需整体重置，故为 let）
let routeGroups = {};     // dayIndex -> { line, arrows } 当日有向路线
let dayEls = {};          // dayIndex -> {body, items: {key, el}}

/* 有向路线：Mercator 等角方位角（dx/dy 必须同为弧度尺度，否则箭头角度整体失准）+ 当日流动动画高亮 */
function mercY(lat){
  const r = Math.max(-85, Math.min(85, Number(lat) || 0)) * Math.PI / 180;
  return Math.log(Math.tan(Math.PI / 4 + r / 2));
}
function mercYinv(y){
  return (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;
}
function routeArrowDeg(a, b){   /* a,b: [lat,lng]；箭头默认朝右(东)，返回 CSS rotate 角度 */
  let dl = Number(b[1]) - Number(a[1]);
  if (dl > 180) dl -= 360; else if (dl < -180) dl += 360;   /* 跨 180° 经线取最短方向 */
  const dx = dl * Math.PI / 180;                            /* 与 mercY 保持同一弧度尺度 */
  const dy = -(mercY(b[0]) - mercY(a[0]));
  return Math.atan2(dy, dx) * 180 / Math.PI;
}
function routeMidPoint(a, b){   /* 投影空间中点：保证箭头落在渲染线段的视觉中点上 */
  return [mercYinv((mercY(a[0]) + mercY(b[0])) / 2), (a[1] + b[1]) / 2];
}
let activeRouteDay = -1;
function highlightRoute(di){
  if (di === activeRouteDay) return;
  const prev = routeGroups[activeRouteDay];
  if (prev && prev.line && prev.line.getElement){
    const el = prev.line.getElement();
    if (el) el.classList.remove('route-flow');
  }
  const g = routeGroups[di];
  if (g && g.line && g.line.getElement){
    const el = g.line.getElement();
    if (el) el.classList.add('route-flow');
  }
  activeRouteDay = di;
}

function pinIcon(emoji, cls, isHotel){
  return L.divIcon({
    className: '',
    html: `<div class="iter-pin ${cls} ${isHotel?'hotel':''}"><span class="e">${emoji}</span></div>`,
    iconSize: [30,30], iconAnchor: [15,27], popupAnchor: [0,-24]
  });
}
function emojiFor(p){
  return EMOJI[p.type] || EMOJI_FALLBACK[p.type] || '📍';
}

function render(){
  const trip = TRIP.trip || {};
  document.getElementById('ttTitle').textContent = trip.title || '行程';
  const metas = [];
  if (trip.destination) metas.push(trip.destination);
  if (trip.dates) metas.push(trip.dates);
  if (trip.budget) metas.push(trip.budget);
  if (trip.travelers) metas.push(trip.travelers);
  document.getElementById('ttMeta').textContent = metas.join(' · ');

  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  const bounds = [];

  (TRIP.days||[]).forEach((day, di) => {
    const color = DAY_COLORS[di % 6];
    const block = document.createElement('div');
    block.className = 'day-block';
    block.innerHTML = `
      <div class="day-head">
        <div class="day-badge" style="background:${color}">D${day.day||di+1}</div>
        <h2>第 ${day.day||di+1} 天 <span class="theme">${day.theme||''}</span></h2>
        <span class="chev">▾</span>
      </div>
      <div class="day-body"></div>`;
    const body = block.querySelector('.day-body');
    const itemRefs = {};

    (day.places||[]).forEach((p, pi) => {
      const key = `d${di}-p${pi}`;
      const emoji = emojiFor(p);
      const item = document.createElement('div');
      item.className = 'place-item';
      item.innerHTML = `
        <div class="place-emoji">${emoji}</div>
        <div class="place-info">
          <div class="place-name">${p.name||''}</div>
          <div class="place-sub">
            ${p.time?`<span class="tag">${p.time}</span>`:''}
            ${p.ticket?`<span class="tag">🎫 ${p.ticket}</span>`:''}
            ${p.transport?`<div>🚗 ${p.transport}</div>`:''}
            ${p.note?`<div>${p.note}</div>`:''}
          </div>
        </div>`;
      /* 编辑器：删除按钮（不弹 confirm，撤销兜底）+ HTML5 拖拽 */
      const del = document.createElement('button');
      del.className = 'place-del'; del.type = 'button';
      del.title = '删除此地点'; del.textContent = '✕';
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();   /* 不触发条目点击联动 */
        TRIP.days[di].places.splice(pi, 1);
        pushHistory();         /* 变更后推入新状态 */
        rerender();
      });
      item.appendChild(del);
      /* 编辑器：编辑按钮（打开编辑表单；stopPropagation 不触发条目点击联动） */
      const editBtn = document.createElement('button');
      editBtn.className = 'place-edit'; editBtn.type = 'button';
      editBtn.title = '编辑此地点'; editBtn.textContent = '✎';
      editBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        closeAddForm();
        openEditForm(di, pi);
      });
      item.appendChild(editBtn);
      item.draggable = true;
      item.addEventListener('dragstart', (ev) => {
        dragCtx = { di: di, pi: pi, el: item };
        item.classList.add('dragging');
        if (ev.dataTransfer){
          try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', key); } catch (err) {}
        }
      });
      item.addEventListener('dragend', () => { item.classList.remove('dragging'); cleanupDrag(); });
      body.appendChild(item);
      itemRefs[key] = item;

      // 地图标记（m 提升到循环层级，供时间线条目点击定位地图使用）
      let m = null;
      if (p.lat != null && p.lng != null){
        m = L.marker([p.lat, p.lng], {
          icon: pinIcon(emoji, `day-${di+1}`),
          title: p.name
        }).addTo(mapLayers);
        m.bindPopup(`
          <div class="iter-popup">
            <div class="pp-name">${emoji} ${p.name||''}</div>
            ${p.time?`<div class="pp-row">⏰ ${p.time}</div>`:''}
            ${p.ticket?`<div class="pp-row">🎫 ${p.ticket}</div>`:''}
            ${p.transport?`<div class="pp-row">🚗 ${p.transport}</div>`:''}
            ${p.note?`<div class="pp-row">${p.note}</div>`:''}
          </div>`, { className: 'iter-popup' });
        m.on('click', () => {
          lastActiveDay = di;
          activateItem(item, m);
          highlightRoute(di);
          openPanel();
        });
        markers[key] = m;
        bounds.push([p.lat, p.lng]);
      }
      item.addEventListener('click', () => {
        if (m) { map.flyTo([p.lat, p.lng], 13); m.openPopup(); }
        lastActiveDay = di;
        activateItem(item, m);
        highlightRoute(di);
      });
    });

    // 酒店卡片
    if (day.hotel && day.hotel.name){
      const h = day.hotel;
      const key = `d${di}-hotel`;
      const card = document.createElement('div');
      card.className = 'hotel-card';
      card.id = key;
      const prices = h.prices || [];
      const best = prices.length ? prices.reduce((a,b)=> (a.price <= b.price ? a : b)) : null;
      let rows = prices.map(pr => `
        <tr class="${pr === best ? 'best' : ''}">
          <td class="platform">${pr.platform}${pr === best ? '<span class="best-tag">最低</span>' : ''}</td>
          <td class="amount">¥${pr.price}</td>
          <td class="bf">${pr.breakfast ? '含早' : '无早'}</td>
          <td class="pd-note">${pr.note||''}</td>
        </tr>`).join('') || '<tr><td colspan="4" style="color:#A8A298">暂无报价</td></tr>';
      card.innerHTML = `
        <div class="hotel-head"><span class="pin">🏨</span><h3>${h.name}</h3></div>
        ${h.note?`<div class="hotel-note">${h.note}</div>`:''}
        <table class="price-table">
          <tr><th>平台</th><th>价格</th><th>早餐</th><th>备注</th></tr>
          ${rows}
        </table>
        ${h.verdict?`<div class="verdict"><div class="verdict-title">✦ 建议</div><p>${h.verdict}</p></div>`:''}
        ${h.bookingUrl?`<div class="book-row"><a href="${h.bookingUrl}" target="_blank" class="book-btn">📋 去预订 <span class="src">RollingGo</span></a></div>`:''}`;
      body.appendChild(card);

      // 酒店标记（m 提升到卡片层级，点击卡片可定位酒店）
      let hm = null;
      if (h.lat != null && h.lng != null){
        hm = L.marker([h.lat, h.lng], { icon: pinIcon('🏨','hotel',true), title: h.name }).addTo(mapLayers);
        hm.bindPopup(`<div class="iter-popup"><div class="pp-name">🏨 ${h.name}</div>
          <div class="pp-row">${best ? '最低 ¥'+best.price + '（' + best.platform + '）' : ''}</div>
          ${h.note?`<div class="pp-row">${h.note}</div>`:''}
          ${h.bookingUrl?`<div class="pp-row" style="margin-top:6px"><a href="${h.bookingUrl}" target="_blank" style="color:var(--accent);font-weight:600;font-size:12px;text-decoration:none">📋 去预订</a></div>`:''}</div>`);
        hm.on('click', () => {
          card.classList.add('active');
          card.scrollIntoView({behavior:'smooth', block:'center'});
          openPanel();
          setTimeout(()=>card.classList.remove('active'), 1600);
        });
        markers[key] = hm;
        bounds.push([h.lat, h.lng]);
      }
      // 点击酒店卡片：定位地图到酒店
      card.addEventListener('click', () => {
        if (hm) { map.flyTo([h.lat, h.lng], 14); hm.openPopup(); }
        card.classList.add('active');
        setTimeout(()=>card.classList.remove('active'), 1400);
      });
    }

    // 当天路线连线（有向）：白色描边 + 主色线，每段中点一枚方向箭头
    const pts = (day.places||[]).filter(p=>p.lat!=null&&p.lng!=null).map(p=>[p.lat,p.lng]);
    if (pts.length >= 2){
      L.polyline(pts, { color: '#FFFFFF', weight: 6, opacity: .65, lineCap: 'round', lineJoin: 'round', className: 'route-line-casing route-day-' + di }).addTo(mapLayers);
      const line = L.polyline(pts, { color, weight: 3, opacity: .9, lineCap: 'round', lineJoin: 'round', dashArray: '6 8', className: 'route-line-main route-day-' + di }).addTo(mapLayers);
      routeGroups[di] = { line: line, arrows: [] };
      for (let s = 0; s < pts.length - 1; s++){
        const a = pts[s], b = pts[s + 1];
        if (Math.abs(b[1] - a[1]) < 1e-9 && Math.abs(mercY(b[0]) - mercY(a[0])) < 1e-9) continue;   /* 重合坐标跳过 */
        const deg = routeArrowDeg(a, b);
        const mid = routeMidPoint(a, b);
        const am = L.marker(mid, {
          icon: L.divIcon({ className: '', iconSize: [14, 14], iconAnchor: [7, 7],
            html: '<div class="route-arrow-wrap" style="--rc:' + color + ';transform:rotate(' + deg.toFixed(2) + 'deg)"><i class="route-arrow"></i></div>' }),
          interactive: false, zIndexOffset: -800   /* 位于图钉之下，不拦截点击 */
        }).addTo(mapLayers);
        routeGroups[di].arrows.push(am);
      }
    }

    // 折叠交互
    const head = block.querySelector('.day-head');
    head.addEventListener('click', ()=> block.classList.toggle('closed'));

    /* 编辑器：本天作为拖放目标。酒店卡片虽在 day-body 内但不参与——
       占位符最多插到酒店卡片之前，索引只数 .place-item */
    block.addEventListener('dragenter', () => {
      if (block.classList.contains('closed')) block.classList.remove('closed');   /* 折叠天无法放置，自动展开 */
    });
    body.addEventListener('dragover', (ev) => {
      if (!dragCtx) return;
      ev.preventDefault();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
      block.classList.add('drop-target');
      const others = Array.prototype.filter.call(body.querySelectorAll('.place-item'), el => el !== dragCtx.el);
      let ref = null;
      for (let i = 0; i < others.length; i++){
        const r = others[i].getBoundingClientRect();
        if (ev.clientY < r.top + r.height / 2){ ref = others[i]; break; }
      }
      if (ref) body.insertBefore(dropPlaceholder, ref);
      else {
        const card = body.querySelector('.hotel-card');
        if (card) body.insertBefore(dropPlaceholder, card); else body.appendChild(dropPlaceholder);
      }
    });
    body.addEventListener('dragleave', () => { block.classList.remove('drop-target'); });
    body.addEventListener('drop', (ev) => {
      ev.preventDefault();
      block.classList.remove('drop-target');
      if (!dragCtx){ cleanupDrag(); return; }
      let dstIdx = 0;   /* 占位符之前的条目数 = 插入索引 */
      for (let i = 0; i < body.children.length; i++){
        const ch = body.children[i];
        if (ch === dropPlaceholder) break;
        if (ch.classList && ch.classList.contains('place-item')) dstIdx++;
      }
      const srcDi = dragCtx.di, srcPi = dragCtx.pi;
      cleanupDrag();
      let idx = dstIdx;
      if (srcDi === di && idx > srcPi) idx -= 1;   /* 同天先删后插的索引补偿 */
      if (srcDi === di && idx === srcPi) return;   /* 原位放置：不算编辑，不进历史 */
      const moved = TRIP.days[srcDi].places.splice(srcPi, 1)[0];
      TRIP.days[di].places.splice(idx, 0, moved);
      pushHistory();                               /* 变更后推入新状态 */
      rerender();
    });

    dayEls[di] = { body, itemRefs };
    timeline.appendChild(block);
  });

  // AI 综合建议
  const summary = document.getElementById('summary');
  if (TRIP.summary && TRIP.summary.length){
    summary.innerHTML = `<h2>🧠 AI 综合建议</h2><ul>` +
      TRIP.summary.map(s=>`<li>${s}</li>`).join('') + `</ul>`;
  } else { summary.style.display = 'none'; }

  // 视图范围：首次渲染 fit 全图；重渲染由 rerender 保持用户视野（skipNextFit）
  if (bounds.length && !skipNextFit){
    map.fitBounds(bounds, { padding: [60,60] });
  }
  skipNextFit = false;
}

/* 双向联动：激活时间线条目 + 对应标记 */
let currentActive = null;
function activateItem(itemEl, marker){
  if (currentActive){ currentActive.el.classList.remove('active'); if (currentActive.m) currentActive.m.setIcon(currentActive.m._origIcon || currentActive.m.getIcon()); }
  itemEl.classList.add('active');
  if (marker){
    marker._origIcon = marker.getIcon();
    const el = marker.getElement();
    if (el){ el.querySelector('.iter-pin').classList.add('active'); }
  }
  currentActive = { el: itemEl, m: marker };
}

/* ==================== 交互编辑器 ====================
   数据源唯一：所有编辑 = 改 TRIP.days → rerender()。
   历史栈模型：每次编辑「变更完成后」pushHistory() 记录新状态，idx 指向当前帧；
   undo 取 idx-1、redo 取 idx+1。这样 redo 才有帧可回（变更前快照模型下，
   编辑后的状态不在栈里，重做无从恢复）。 */

let skipNextFit = false;      /* rerender 期间抑制 fitBounds，保持用户视野 */
let lastActiveDay = 0;        /* 新增表单默认落点天 */
let dragCtx = null;           /* { di, pi, el } 拖拽上下文 */
const dropPlaceholder = document.createElement('div');
dropPlaceholder.className = 'drop-placeholder';
dropPlaceholder.textContent = '放在这里';
function cleanupDrag(){
  dragCtx = null;
  Array.prototype.forEach.call(document.querySelectorAll('.drop-target'), el => el.classList.remove('drop-target'));
  if (dropPlaceholder.parentNode) dropPlaceholder.parentNode.removeChild(dropPlaceholder);
}

/* ---------- 可重渲染：图层集中清理 + 折叠状态保持 + 视野保持 ---------- */
function clearMap(){
  mapLayers.clearLayers();
  markers = {}; routeGroups = {}; dayEls = {};
  activeRouteDay = -1;
  currentActive = null;   /* 旧 marker 引用随重建作废 */
}
function rerender(){
  const closed = new Set();
  Array.prototype.forEach.call(document.querySelectorAll('#timeline .day-block'), (b, i) => {
    if (b.classList.contains('closed')) closed.add(i);
  });
  let c = null, z = null;
  try { if (map.getCenter) c = map.getCenter(); if (map.getZoom != null) z = map.getZoom(); } catch (e) {}
  clearMap();
  skipNextFit = true;
  render();
  if (c && z != null && map.setView){ try { map.setView(c, z, { animate: false }); } catch (e) {} }
  Array.prototype.forEach.call(document.querySelectorAll('#timeline .day-block'), (b, i) => {
    if (closed.has(i)) b.classList.add('closed');
  });
}

/* ---------- 撤销 / 重做（TRIP 是 const，只能 Object.assign 内部替换；H[idx] 即当前状态） ---------- */
let editHistory = [];
let editHistoryIdx = -1;
function pushHistory(){
  editHistory = editHistory.slice(0, editHistoryIdx + 1);
  editHistory.push(JSON.parse(JSON.stringify(TRIP)));
  if (editHistory.length > 50) editHistory.shift();   /* 上限 50 步 */
  editHistoryIdx = editHistory.length - 1;
  updateUndoRedoBtns();
}
function applySnapshot(s){
  Object.assign(TRIP, JSON.parse(JSON.stringify(s)));
  rerender();
  updateUndoRedoBtns();
}
function undo(){
  if (editHistoryIdx <= 0) return;
  editHistoryIdx--;
  applySnapshot(editHistory[editHistoryIdx]);
}
function redo(){
  if (editHistoryIdx >= editHistory.length - 1) return;
  editHistoryIdx++;
  applySnapshot(editHistory[editHistoryIdx]);
}
function updateUndoRedoBtns(){
  const u = document.getElementById('btn-undo');
  const r = document.getElementById('btn-redo');
  if (u) u.disabled = editHistoryIdx <= 0;
  if (r) r.disabled = editHistoryIdx >= editHistory.length - 1;
}

/* ---------- 地图选点新增 + 表单编辑：crosshair 模式 + 内联表单（新增/编辑双模式） ---------- */
let pickingMode = false;
let pickHandler = null;
let pendingPoint = null;
let formMode = 'add';        /* 'add' 新增 | 'edit' 编辑已有地点 */
let editTarget = null;       /* 编辑目标 { di, pi } */
let rePickTarget = null;     /* 重新选点目标 { di, pi }（编辑表单内「更改位置」） */
const PICK_HINT_ADD = '📍 点击地图选择地点位置（Esc 取消）';
const PICK_HINT_REPICK = '📍 点击地图为新位置（Esc 取消）';

function setFormMode(mode){
  formMode = mode;
  const isEdit = mode === 'edit';
  const title = document.getElementById('af-title');
  const dayWrap = document.getElementById('af-day-wrap');
  const repickWrap = document.getElementById('af-repick-wrap');
  const okBtn = document.getElementById('af-ok');
  const dialog = document.getElementById('add-form');
  if (title) title.textContent = isEdit ? '✎ 编辑地点' : '📍 新增地点';
  if (dayWrap) dayWrap.style.display = isEdit ? 'none' : '';
  if (repickWrap) repickWrap.style.display = isEdit ? '' : 'none';
  if (okBtn) okBtn.textContent = isEdit ? '保存修改' : '确定添加';
  if (dialog) dialog.setAttribute('aria-label', isEdit ? '编辑地点' : '新增地点');
}
function updateOkDisabled(){
  const nameEl = document.getElementById('af-name');
  const okBtn = document.getElementById('af-ok');
  if (nameEl && okBtn) okBtn.disabled = !nameEl.value.trim();
}
function enterPicking(){
  if (pickingMode){ exitPicking(); return; }   /* 防双开：再点一次 = 取消 */
  pickingMode = true;
  document.body.classList.add('picking');
  const btn = document.getElementById('btn-add');
  if (btn) btn.classList.add('active-mode');
  if (map.dragging && map.dragging.disable) map.dragging.disable();
  if (map.doubleClickZoom && map.doubleClickZoom.disable) map.doubleClickZoom.disable();
  const hint = document.getElementById('pick-hint');
  if (hint) hint.textContent = rePickTarget ? PICK_HINT_REPICK : PICK_HINT_ADD;
  pickHandler = function(ev){
    const ll = ev && ev.latlng;
    const rt = rePickTarget;   /* exitPicking 会清空 rePickTarget，先取快照 */
    exitPicking();
    if (ll){
      if (rt) rePickTo(rt, ll.lat, ll.lng);
      else openAddForm(ll.lat, ll.lng);
    }
  };
  map.once('click', pickHandler);
}
function exitPicking(){
  if (!pickingMode) return;
  pickingMode = false;
  if (pickHandler){ map.off('click', pickHandler); pickHandler = null; }
  document.body.classList.remove('picking');
  const btn = document.getElementById('btn-add');
  if (btn) btn.classList.remove('active-mode');
  if (map.dragging && map.dragging.enable) map.dragging.enable();
  if (map.doubleClickZoom && map.doubleClickZoom.enable) map.doubleClickZoom.enable();
  rePickTarget = null;   /* 未完成选点即退出：清目标，防残留影响下次选点 */
  const hint = document.getElementById('pick-hint');
  if (hint) hint.textContent = PICK_HINT_ADD;
}
function addFormOpen(){
  const bd = document.getElementById('add-form-backdrop');
  return !!(bd && bd.classList.contains('open'));
}
function openAddForm(lat, lng){
  pendingPoint = { lat: Math.round(lat * 1e6) / 1e6, lng: Math.round(lng * 1e6) / 1e6 };
  editTarget = null; rePickTarget = null;
  setFormMode('add');
  const daySel = document.getElementById('af-day');
  daySel.innerHTML = '';
  (TRIP.days || []).forEach((d, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = 'D' + (d.day || i + 1) + (d.theme ? ' · ' + d.theme : '');
    daySel.appendChild(o);
  });
  daySel.value = String(Math.min(lastActiveDay, (TRIP.days || []).length - 1));
  document.getElementById('af-name').value = '';
  document.getElementById('af-time').value = '';
  document.getElementById('af-transport').value = '';
  document.getElementById('af-ticket').value = '';
  document.getElementById('af-note').value = '';
  document.getElementById('af-type').value = 'attraction';
  document.getElementById('af-pos').textContent = '坐标：' + pendingPoint.lat.toFixed(5) + ', ' + pendingPoint.lng.toFixed(5);
  document.getElementById('af-ok').disabled = true;
  document.getElementById('add-form-backdrop').classList.add('open');
  const nameEl = document.getElementById('af-name');
  if (nameEl && nameEl.focus) nameEl.focus();
}
function openEditForm(di, pi){
  const p = TRIP.days[di] && TRIP.days[di].places[pi];
  if (!p) return;
  pendingPoint = { lat: p.lat != null ? p.lat : 0, lng: p.lng != null ? p.lng : 0 };
  editTarget = { di: di, pi: pi };
  rePickTarget = null;
  setFormMode('edit');
  document.getElementById('af-name').value = p.name || '';
  document.getElementById('af-type').value = p.type || 'attraction';
  document.getElementById('af-time').value = p.time || '';
  document.getElementById('af-transport').value = p.transport || '';
  document.getElementById('af-ticket').value = p.ticket || '';
  document.getElementById('af-note').value = p.note || '';
  document.getElementById('af-pos').textContent = '坐标：' + (p.lat != null ? p.lat.toFixed(5) : '—') + ', ' + (p.lng != null ? p.lng.toFixed(5) : '—');
  updateOkDisabled();
  document.getElementById('add-form-backdrop').classList.add('open');
  const nameEl = document.getElementById('af-name');
  if (nameEl && nameEl.focus) nameEl.focus();
}
function closeAddForm(){
  pendingPoint = null;
  editTarget = null;
  rePickTarget = null;
  formMode = 'add';
  const bd = document.getElementById('add-form-backdrop');
  if (bd) bd.classList.remove('open');
}
/* 编辑表单「更改位置」：关表单 → 进选点模式 → 点击地图写回新坐标 */
function startRepick(){
  if (!editTarget) return;
  const t = { di: editTarget.di, pi: editTarget.pi };
  closeAddForm();   /* 会清 editTarget/rePickTarget，先复制目标再关 */
  rePickTarget = t;
  enterPicking();
}
/* 写回新坐标：点回原位不算编辑；成功则进历史并重渲染 */
function rePickTo(t, lat, lng){
  if (!t) return;
  const p = TRIP.days[t.di] && TRIP.days[t.di].places[t.pi];
  if (!p) return;
  const nLat = Math.round(lat * 1e6) / 1e6;
  const nLng = Math.round(lng * 1e6) / 1e6;
  if (p.lat != null && p.lng != null && Math.abs(p.lat - nLat) < 1e-9 && Math.abs(p.lng - nLng) < 1e-9) return;
  p.lat = nLat; p.lng = nLng;
  lastActiveDay = t.di;
  pushHistory();
  rerender();
}
function confirmSave(){
  if (!pendingPoint) return;
  const nameEl = document.getElementById('af-name');
  const name = nameEl.value.trim();
  if (!name){ if (nameEl.focus) nameEl.focus(); return; }
  const type = document.getElementById('af-type').value;
  const time = document.getElementById('af-time').value.trim();
  const transport = document.getElementById('af-transport').value.trim();
  const ticket = document.getElementById('af-ticket').value.trim();
  const note = document.getElementById('af-note').value.trim();
  const pt = pendingPoint;   /* closeAddForm 会置空 pendingPoint，先取坐标快照 */
  if (formMode === 'edit' && editTarget){
    const t = editTarget;
    const p = TRIP.days[t.di].places[t.pi];
    if (!p){ closeAddForm(); return; }
    /* 空修改检测：字段与坐标全部与现值一致 → 仅关表单，不进历史 */
    const fieldsSame = ['name','type','time','transport','ticket','note'].every(k => (p[k] || '') ===
      ({ name: name, type: type, time: time, transport: transport, ticket: ticket, note: note })[k]);
    const posSame = (p.lat != null ? p.lat : 0) === pt.lat && (p.lng != null ? p.lng : 0) === pt.lng;
    closeAddForm();
    if (fieldsSame && posSame) return;
    const patch = { name: name, type: type, time: time, transport: transport, ticket: ticket, note: note };
    if (!posSame){ patch.lat = pt.lat; patch.lng = pt.lng; }   /* 无坐标地点编辑文字字段时不得写入 0,0 */
    Object.assign(p, patch);
    pushHistory();   /* 变更后推入新状态 */
    lastActiveDay = t.di;
    rerender();
    return;
  }
  const nDays = (TRIP.days || []).length;
  const di = Math.min(Math.max(parseInt(document.getElementById('af-day').value, 10) || 0, 0), Math.max(nDays - 1, 0));
  TRIP.days[di].places.push({ name: name, lat: pt.lat, lng: pt.lng, type: type, time: time, transport: transport, ticket: ticket, note: note });
  pushHistory();   /* 变更后推入新状态 */
  lastActiveDay = di;
  closeAddForm();
  rerender();
  const key = 'd' + di + '-p' + (TRIP.days[di].places.length - 1);
  const m = markers[key];
  if (m){ map.flyTo([pt.lat, pt.lng], Math.max(map.getZoom(), 13)); m.openPopup(); }
}

/* ---------- 导出双产物：基于 PRISTINE_HTML 纯净快照，而非实时 DOM ---------- */
const TRIP_RE = /const TRIP = [\s\S]*?;\n/;
function buildExportJSON(){ return JSON.stringify(TRIP, null, 2); }
function buildExportHTML(){
  if (!TRIP_RE.test(PRISTINE_HTML)) return null;
  /* 全量转义 < 为 \u003c：JSON 结构字符不含 <，只影响字符串值——
     同时防内联脚本的闭合标签被字符串值提前终止、防 HTML 注释解析边界 */
  const json = JSON.stringify(TRIP, null, 2).replace(/</g, '\\u003c');
  return PRISTINE_HTML.replace(TRIP_RE, 'const TRIP = ' + json + ';\n');
}
function download(filename, text){
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 800);
}
function exportJSON(){ download('my_trip.json', buildExportJSON()); }
function exportHTML(){ const s = buildExportHTML(); if (s) download('my_trip_edited.html', s); }

/* ---------- 全局键盘：Esc 关表单/退选点；Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y（输入框内豁免） ---------- */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (addFormOpen()){ closeAddForm(); return; }
    if (pickingMode){ exitPicking(); return; }
    return;
  }
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (typing) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && (e.key === 'z' || e.key === 'Z')){
    if (e.preventDefault) e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  } else if (mod && !e.shiftKey && !e.altKey && (e.key === 'y' || e.key === 'Y')){
    if (e.preventDefault) e.preventDefault();
    redo();
  }
});

/* ---------- 工具条绑定：footer 不随 render 重建，只在初始化绑一次 ---------- */
(function initToolbar(){
  function on(id, fn){ const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  on('btn-undo', undo);
  on('btn-redo', redo);
  on('btn-add', enterPicking);
  on('btn-export-json', exportJSON);
  on('btn-export-html', exportHTML);
  const nameEl = document.getElementById('af-name');
  if (nameEl) nameEl.addEventListener('input', updateOkDisabled);
  on('af-ok', confirmSave);
  on('af-cancel', closeAddForm);
  on('af-repick', startRepick);
  const bd = document.getElementById('add-form-backdrop');
  if (bd) bd.addEventListener('click', function(e){ if (e.target === bd) closeAddForm(); });
  updateUndoRedoBtns();
})();

function openPanel(){ document.getElementById('panel').classList.remove('collapsed'); }
function closePanel(){ document.getElementById('panel').classList.add('collapsed'); }

document.getElementById('toggle-panel').addEventListener('click', ()=>{

    p.classList.contains('collapsed') ? '☰ 行程' : '✕ 收起';

/* 移动端默认收起行程面板，先看到地图；按钮文案始终与面板状态一致 */
if (typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 640px)').matches){
  document.getElementById('panel').classList.add('collapsed');

(function syncToggleText(){

/* ---------- 侧边栏横向拉伸：左边缘手柄拖动调宽度（夹边 + 本地记忆 + 地图同步重排） ---------- */
(function initPanelResize(){
  const panel = document.getElementById('panel');
  const handle = document.getElementById('panel-resize');
  if (!panel || !handle) return;
  /* 地图是全屏铺底的覆盖层，面板宽度与地图容器尺寸无关，所以这里完全不碰地图。
     Leaflet 自己监听 window resize；拖面板时再调 invalidateSize 只会让视野中心吸附到像素网格。 */
  const STORE_KEY = 'itertrip-panel-width';
  const PANEL_MIN = 280;
  function bounds(){
    const vw = document.documentElement.clientWidth || window.innerWidth || 1280;
    const maxW = Math.max(220, Math.min(640, vw - 96));   /* 96px 为左上控件带预留 */
    return { minW: Math.min(PANEL_MIN, maxW), maxW: maxW };
  }
  function clamp(w){ const b = bounds(); return Math.round(Math.min(Math.max(w, b.minW), b.maxW)); }
  let curW = 0;   /* 已应用宽度：收手/夹边/键盘都以它为准，避免二次 DOM 测量把刚拖出的宽度盖掉 */
  function applyWidth(w){
    w = clamp(w);
    panel.style.width = w + 'px';
    panel.style.maxWidth = 'none';   /* 覆盖 CSS max-width，改由 JS 夹边控制 */
    curW = w;
    return w;
  }
  function currentWidth(){
    const r = panel.getBoundingClientRect ? panel.getBoundingClientRect() : null;
    return (r && r.width > 0) ? r.width : 400;
  }
  curW = currentWidth();   /* 初始值取自真实布局；无布局环境退回 CSS 默认 400 */
  function persist(w){
    try { if (window.localStorage) window.localStorage.setItem(STORE_KEY, String(w)); } catch (e) {}
  }
  function restore(){
    let v = NaN;
    try { if (window.localStorage) v = parseFloat(window.localStorage.getItem(STORE_KEY) || ''); } catch (e) {}
    if (isFinite(v) && v > 0){ applyWidth(v); }
  }
  let dragging = false, startX = 0, startW = 0;
  function onDown(e){
    if (panel.classList.contains('collapsed')) return;   /* 收起时手柄已出屏 */
    dragging = true; startX = e.clientX; startW = curW;
    document.body.classList.add('panel-dragging');
    if (handle.setPointerCapture){ try { handle.setPointerCapture(e.pointerId); } catch (err) {} }
    if (e && e.preventDefault) e.preventDefault();
  }
  function onMove(e){
    if (!dragging || !e) return;
    applyWidth(startW + (startX - e.clientX));   /* 面板右锚定：向左拖 = 变宽 */
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('panel-dragging');
    applyWidth(curW);
    persist(curW);
  }
  handle.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('resize', function(){ applyWidth(curW); });   /* 夹边跟随视口；地图由 Leaflet 自己处理 */
  handle.addEventListener('keydown', function(e){   /* 键盘微调，屏幕阅读器友好 */
    const step = e.shiftKey ? 80 : 24;
    const b = bounds();
    let w = curW, d = 0;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') d = -step;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') d = step;
    else if (e.key === 'Home') w = b.minW;
    else if (e.key === 'End') w = b.maxW;
    else return;
    applyWidth(w + d);
    persist(curW);
    if (e.preventDefault) e.preventDefault();
  });
  restore();
})();

pushHistory();   /* 初始快照：第一次撤销的落点 */
render();

/* 测试钩子：自包含零依赖，只读视图 + 纯函数，供 jsdom / 探针校验（不影响用户） */
window.__ITEST__ = {

  history: function(){ return { len: editHistory.length, idx: editHistoryIdx }; },
  pushHistory: pushHistory, undo: undo, redo: redo,
