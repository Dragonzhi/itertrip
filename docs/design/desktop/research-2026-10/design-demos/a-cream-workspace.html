 const d=days[day];if(!d.places.some(p=>p.id===selected))selected=d.places[0].id;
 document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-selected',Number(b.dataset.day)===day));
 $('#day-title').textContent=d.title;$('#day-number').textContent='DAY 0'+(day+1);$('#map-heading').textContent='第 '+(day+1)+' 天的路线';$('#map-count').textContent=d.places.length+' 个地点';
 $('#weather').innerHTML=day===0?'<div class="weather-main">'+rainIcon+'<div class="weather-text"><strong><span class="mono">22°C / 17°C</span>　下午有雨</strong><p>14:00–17:00 · 影响人民公园后半段、宽窄巷子</p></div></div><button class="button" id="weather-open">查看雨天候选 →</button>':'<div class="weather-main"><div class="weather-text"><strong>第 '+(day+1)+' 天尚未设置天气情境</strong><p>天气面板仅演示第一天雨情，不查询真实预报</p></div></div><button class="button" data-stub="查看天气">查看天气</button>';
 $('#applied-banner').hidden=!applied;
 $('#summary').innerHTML='<span class="mono"><strong>'+d.period+'</strong></span><span>'+d.summary+'</span><span>'+d.missing+'</span><span>'+d.walk+'</span><span class="needs">'+d.issues+'</span>';
 $('#timeline').innerHTML=d.places.map((p,i)=>'<button class="place-row '+(p.id===selected?'selected':'')+'" data-place="'+p.id+'" aria-pressed="'+(p.id===selected)+'"><span class="time mono">'+p.start+'<span class="end">'+p.end+' 离开</span></span><span class="number">'+(i+1)+'</span><span><div class="place-title">'+p.name+'</div><div class="place-sub"><span>'+p.duration+'</span><span>'+p.kind+'</span>'+(p.risk?'<span class="tag">'+p.risk+'</span>':'')+'</div></span><span class="chev">›</span></button>'+(d.legs[i]?'<div class="transport-row '+(d.legs[i].unknown?'unknown':'')+'"><button data-leg="'+i+'"><span class="mode">'+d.legs[i].mode+'</span>'+(d.legs[i].unknown?'<span>尚无交通记录</span><span class="link">主动查询 ↗</span>':'<span class="mono">'+d.legs[i].time+'</span><span>'+(d.legs[i].distance||d.legs[i].buffer||'')+'</span><span class="link">比较交通 ↗</span>')+'</button></div>':'')).join('')+(d.free?'<div class="free">15:00 以后，留给返程和临时起意。</div>':'');
 $('#hotel').innerHTML='<div class="hotel-text"><span class="hotel-icon" aria-hidden="true">⌂</span><strong>'+(d.hotel||'当天住宿未添加')+'</strong>'+(d.hotel?'<span class="tag blue">待确认</span>':'')+'</div><button class="plain" data-stub="'+(d.hotel?'确认住宿':'添加住宿')+'">'+(d.hotel?'查看住宿 →':'＋ 添加住宿')+'</button>';
 drawMap();renderDetail();$('#undo').disabled=history.length===0;
}
function drawMap(){const d=days[day],pos=positions[d.places.length]||positions[4];let line=pos.map(p=>p.join(',')).join(' ');$('#map').innerHTML='<defs><pattern id="dots" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d7dfe9"/></pattern></defs><rect width="520" height="355" fill="url(#dots)"/><polyline points="'+line+'" fill="none" stroke="#a0adbe" stroke-width="9" opacity=".15" stroke-linejoin="round"/><polyline points="'+line+'" fill="none" stroke="#7d8fa8" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/>'+d.places.map((p,i)=>'<g class="pin '+(p.id===selected?'selected':'')+'" role="button" tabindex="0" data-pin="'+p.id+'" aria-label="'+(i+1)+' '+p.name+'，查看详情" aria-pressed="'+(p.id===selected)+'" transform="translate('+pos[i].join(',')+')"><circle r="18"/><text dy="5">'+(i+1)+'</text><text class="label" y="'+(i%2===0?41:-30)+'">'+p.name+'</text></g>').join('');}
function renderDetail(){const d=days[day],p=d.places.find(p=>p.id===selected),i=d.places.indexOf(p);$('#detail').innerHTML='<div class="detail-header"><div class="detail-title"><span class="number">'+(i+1)+'</span><h3>'+p.name+'</h3></div><span class="small">地点详情</span></div><div class="detail-line"><strong class="mono">'+p.start+'–'+p.end+'</strong><span>'+p.duration+'</span><span>'+p.kind+'</span></div><p>'+p.note+'</p><div class="detail-actions"><button class="button" data-stub="编辑'+p.name+'">编辑安排</button><button class="button" data-stub="为'+p.name+'安排预约">安排预约</button><button class="button soft" data-stub="去'+p.name+'">去这里 ↗</button></div>';}
function selectPlace(id){selected=id;render();const row=document.querySelector('[data-place="'+id+'"]');row?.focus({preventScroll:true});}
function openModal(title,body,badge='草图演示'){returnFocus=document.activeElement;$('#modal-title').textContent=title;$('#modal-badge').textContent=badge;$('#modal-body').innerHTML=body;$('#modal').hidden=false;$('#modal-close').focus();}
function closeModal(){if($('#modal').hidden)return;$('#modal').hidden=true;returnFocus?.isConnected&&returnFocus.focus({preventScroll:true});}
function stub(name){openModal(name,'<p class="dialog-intro">这是草图演示，用于确认入口和操作位置。此操作不连接正式接口，也不会查询或修改真实数据。</p><div class="notice">'+(name.startsWith('去')?'正式产品将提供地图应用导航交接。本草图的路线示意没有真实坐标，因此不会跳转导航。':'可演示：切换日期、地点与地图联动、交通比较，以及雨天提案的确认和撤销。')+'</div><div class="dialog-actions"><button class="button primary" data-close>知道了</button></div>');}
function transport(index){const d=days[day],leg=d.legs[index],from=d.places[index].name,to=d.places[index+1].name;if(leg.unknown){openModal('这段交通还没有查询','<p class="dialog-intro">'+from+' → '+to+'</p><div class="notice">未查询的交通不计入当天已知交通汇总。需要主动查询后再核对安排；本演示不会发送网络请求。</div><div class="dialog-actions"><button class="button" data-close>稍后处理</button><button class="button primary" id="query-demo">查询交通 · 演示</button></div>');return;}
 const subway=day===0&&index===1;openModal('比较两站交通','<p class="dialog-intro">'+from+' → '+to+' · 所有耗时均为演示数据</p><div class="compare"><div class="compare-choice current"><h3>'+leg.mode+' · 当前安排</h3><strong class="mono">'+parseInt(leg.time)+'</strong><small>分</small><p>'+(leg.distance||leg.buffer||'按当前草稿安排')+'</p></div><div class="compare-choice"><h3>'+((leg.mode==='打车')?'地铁':'打车')+' · 备选</h3><strong class="mono">'+(subway?'18':leg.mode==='步行'?'5':'35')+'</strong><small>分</small><p>'+(subway?'比地铁少 10 分；费用未查询':'此处仅用于对比演示，需重新查询')+'</p></div></div><p class="dialog-intro" style="margin-top:16px">缓冲时间单独展示。切换方式后，后续时段仍需重新核对。</p><div class="dialog-actions"><span class="small">不会查询真实路线</span><button class="button" data-close>保留当前</button><button class="button primary" id="transport-demo">选择备选 · 演示说明</button></div>');}
function proposal(){if(applied){openModal('雨天候选已加入草稿','<p class="dialog-intro">当前草稿已展示雨天调整；交通和新预约仍需你复核。可使用顶部「撤销」恢复原始三日行程。</p><div class="dialog-actions"><button class="button primary" data-close>回到行程</button></div>','等待复核');return;}openModal('雨天下午，换一种逛法','<p class="dialog-intro">雨天候选：室内安排；交通与预约需复核。<br>演示情境：第 1 天 14:00–17:00 有雨。</p><div class="proposal-item"><b>第 1 天</b><div>人民公园 → 成都博物馆<small>保留 13:00–14:30 草稿时段；新预约尚未确认。</small></div></div><div class="proposal-item"><b>第 2 天</b><div>移除重复的成都博物馆，留出午后空档<small>原预约 14:00 与原计划 13:00 冲突；原预约需自行取消或改期，不能跨日使用。</small></div></div><div class="proposal-item"><b>第 3 天</b><div>人民公园放入待安排区<small>不自动占用返程留白，具体时间由你决定。</small></div></div><div class="notice">这不是已核实的可执行方案。第 1 天两段相关交通改为未查询，宽窄巷子的户外雨情仍在；第 3 天新增地点也未安排时段。</div><div class="dialog-actions"><button class="button" data-close>保留原行程</button><button class="button primary" id="confirm-proposal">确认加入草稿</button></div>','AI 调整 · 先预览，后确认');}
function applyProposal(){history.push({days:structuredClone(days),applied,day,selected});const park=days[0].places[2];days[0].places[2]={id:'museum-rain',name:'成都博物馆',start:'13:00',end:'14:30',duration:'90 分',kind:'室内 · 博物馆',risk:'新预约待确认',note:'雨天候选草稿。第 2 天原预约不能直接跨日使用，请确认新预约与时段。'};days[0].legs[1]={mode:'未查询',unknown:true};days[0].legs[2]={mode:'未查询',unknown:true};Object.assign(days[0],{summary:'已知交通 8 分 / 1 段',missing:'2 段未查询',issues:'雨情、交通与预约待复核'});days[1].places.splice(1,1);days[1].legs=[{mode:'未查询',unknown:true}];Object.assign(days[1],{summary:'已知交通未知 / 0 段',walk:'已知步行距离未知',missing:'1 段未查询',issues:'原预约需处理',free:false});days[1].places[0].note+=' 原博物馆已从草稿移除，11:00–15:30 留白；原预约需自行处理。';days[2].places.push({...park,start:'待定',end:'待定',duration:'90 分建议',risk:'时段与交通待定',note:'从第 1 天移来的待安排地点。不会自动占用 15:00 后返程留白，时间和交通需你确认。'});days[2].legs.push({mode:'未查询',unknown:true});Object.assign(days[2],{missing:'新增 1 段未查询',issues:'新增地点待安排'});applied=true;day=0;selected='museum-rain';closeModal();render();showToast('雨天候选已加入草稿，仍有待复核事项。可随时撤销。');}
function showToast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500);}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-pin]');if(!b)return;if(b.dataset.day!==undefined){day=Number(b.dataset.day);selected=days[day].places[0].id;render();return;}if(b.dataset.place){selectPlace(b.dataset.place);return;}if(b.dataset.pin){selectPlace(b.dataset.pin);return;}if(b.dataset.leg!==undefined){transport(Number(b.dataset.leg));return;}if(b.dataset.stub){stub(b.dataset.stub);return;}if(b.hasAttribute('data-close')||b.id==='modal-close'){closeModal();return;}if(b.id==='weather-open'||b.id==='ai-open'){proposal();return;}if(b.id==='confirm-proposal'){applyProposal();return;}if(b.id==='undo'&&history.length){const h=history.pop();({days,applied,day,selected}=h);render();showToast('已撤销，恢复原来的三日行程。');return;}if(b.id==='query-demo'){openModal('主动查询 · 草图演示','<p class="dialog-intro">此处会由用户主动发起交通查询。本草图不发送请求，因此保持「未查询」状态，不计入已知交通。</p><div class="dialog-actions"><button class="button primary" data-close>知道了</button></div>');return;}if(b.id==='transport-demo'){openModal('切换交通 · 草图演示','<p class="dialog-intro">正式产品需重新查询交通并核对后续时间。本草图仅展示比较流程，当前交通方式保持原状。</p><div class="dialog-actions"><button class="button primary" data-close>返回行程</button></div>');}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});
document.addEventListener('keydown',e=>{const pin=e.target.closest('[data-pin]');if(pin&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectPlace(pin.dataset.pin);}if(e.key==='Escape'){closeModal();}if(!$('#modal').hidden&&e.key==='Tab'){const controls=[...$('#modal').querySelectorAll('button:not(:disabled),[tabindex="0"]')];if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus();}}const tab=e.target.closest('[data-day]');if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();day=(day+(e.key==='ArrowRight'?1:2))%3;selected=days[day].places[0].id;render();document.querySelector('[data-day="'+day+'"]').focus();}});
render();window.__ready=true;
</script>
<script>const demoAI=document.querySelector('#prototype-ai'),demoColumn=document.querySelector('.map-column');function toggleDemoAI(open){demoAI.hidden=!open;demoColumn.classList.toggle('ai-active',open);(open?document.querySelector('#prototype-prompt'):document.querySelector('#ai-open')).focus()}document.addEventListener('click',e=>{if(e.target.closest('#ai-open')){e.stopImmediatePropagation();toggleDemoAI(demoAI.hidden)}},true);document.querySelector('#prototype-ai-close').onclick=()=>toggleDemoAI(false);document.querySelector('#prototype-preview').onclick=proposal;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#modal').hidden&&!demoAI.hidden)toggleDemoAI(false)});</script></body>
</html>
