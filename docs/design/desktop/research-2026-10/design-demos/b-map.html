<!--
逻辑 B：秒数轮盘 17 % 20 + 1 = 18；huashu-design 网页库 Gallery Dark。
迁移：把画廊的「大幅作品」替换为用户自己的路线关系图；黑色负空间裱框，界面退到周边，
行程浮层可收起，时间与交通直接随路线展示。底部明亮详情让编辑动作易发现。
假设：桌面用户先看关系与距离成本，再查看地点细节；地图为关系示意而非实际地理位置。
未验证：真实 POI、交通、天气、预约及导航；均无网络调用。只演示共同 SPEC 的三日数据与
预览→确认→撤销；未接后端、不写 localStorage，刷新恢复初始状态。本稿属于待选设计方向。
-->

{title:'东边的慢生活',summary:'09:30–15:00',meta:'已知交通 35 分 / 1 段',walk:'已知步行距离未知 · 15:00 后返程留白',hotel:'酒店未添加',places:[{id:'dongjiao',name:'东郊记忆',start:'09:30',end:'11:30',duration:120,note:'停留 120 分钟 · 文创街区',type:'街区漫步',x:68,y:30},{id:'wangping',name:'望平街',start:'13:00',end:'15:00',duration:120,note:'15:00 后返程留白，不自动填入地点',type:'街区漫步',x:29,y:76}],segments:[{text:'地铁 35 分 · 缓冲 10 分',mode:'地铁',minutes:35,buffer:10}]}];
let data=structuredClone(initial),day=0,selected='park',history=[],collapsed=false;const $=s=>document.querySelector(s);let lastFocus=null,toastTimer;
function showToast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5000)}
function openDialog(html){lastFocus=document.activeElement;$('#dialog-content').innerHTML=html;$('#dialog').showModal();$('#close-dialog').focus()}
function closeDialog(){$('#dialog').close();lastFocus?.focus()}
$('#close-dialog').onclick=closeDialog;$('#dialog').addEventListener('close',()=>lastFocus?.focus());$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function demo(label){openDialog(`<div class="dialog-kicker">草图演示</div><h2>${label}</h2><p>这个入口展示功能位置。当前草图未接正式服务，不会发起查询、修改预约或跳转导航。</p><div class="dialog-buttons"><button class="tool light" data-close>知道了</button></div>`)}

function selectPlace(id){selected=id;render()}
function render(){const d=data[day];if(!d.places.some(p=>p.id===selected))selected=d.places[0].id;document.querySelectorAll('[data-day]').forEach(el=>el.setAttribute('aria-selected',String(Number(el.dataset.day)===day)));$('#day-title').textContent=d.title;$('#summary').innerHTML=`<div class="summary-main"><span class="mono">${d.summary}</span><span class="small">${d.places.length} 个地点</span></div>${d.meta}<br>${d.walk}`;$('#schedule').innerHTML=d.places.map((p,i)=>`<button class="stop ${selected===p.id?'selected':''}" data-place="${p.id}" aria-pressed="${selected===p.id}"><span class="index">${String(i+1).padStart(2,'0')}</span><span class="stop-main"><b>${p.name}</b><small class="mono">${p.start}–${p.end} · ${p.duration} 分</small>${p.risk?`<div class="stop-risk">${p.risk}</div>`:''}</span></button>${d.segments[i]?`<button class="transport" data-segment="${i}">${d.segments[i].text}<span class="arrow">↗</span></button>`:''}`).join('');$('#hotel').innerHTML=`<span>${d.hotel}</span><button data-demo="${d.hotel.includes('未添加')?'添加酒店':'确认住宿'}">${d.hotel.includes('未添加')?'＋ 添加':'查看 ↗'}</button>`;document.querySelectorAll('[data-place]').forEach(el=>el.onclick=()=>selectPlace(el.dataset.place));document.querySelectorAll('[data-segment]').forEach(el=>el.onclick=()=>compare(Number(el.dataset.segment)));$('#weather-open').hidden=day!==0;$('#weather-open').innerHTML=data[0].adjusted?'<span class="weather-top">雨天候选已应用</span><span class="small">交通与预约仍需复核<br>宽窄巷子雨天风险仍保留</span><span class="weather-cta">查看调整依据 →</span>':'<span class="weather-top"><span>雨天 · 2 处受影响</span><span class="mono">22° / 17°</span></span><span class="small">14:00–17:00 有雨<br>人民公园后半段、宽窄巷子</span><span class="weather-cta">预览室内候选　→</span>';renderMap(d);renderDetail(d);$('#undo').disabled=history.length===0}
function renderMap(d){const w=900,h=380;const points=d.places.map(p=>({...p,cx:p.x*w/100,cy:p.y*h/100}));$('#map').innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${d.title}路线关系示意">${points.slice(0,-1).map((p,i)=>{const q=points[i+1],s=d.segments[i];return `<path class="route-line ${s?.mode?'':'unknown'}" d="M${p.cx},${p.cy} L${q.cx},${q.cy}"/><g class="segment-svg ${s?.mode?'':'unknown'}" data-map-segment="${i}" role="button" tabindex="0" aria-label="比较${p.name}到${q.name}的交通" transform="translate(${(p.cx+q.cx)/2},${(p.cy+q.cy)/2+(day===0&&i===0?68:0)})"><rect x="-63" y="-16" width="126" height="32" rx="3"/><text y="5">${s?.mode?`${s.mode} ${s.minutes} 分`:'未查询 ↗'}</text></g>`}).join('')}${points.map((p,i)=>`<g class="pin ${p.id===selected?'selected':''}" data-map-place="${p.id}" role="button" tabindex="0" aria-pressed="${p.id===selected}" aria-label="${i+1} ${p.name} ${p.start}至${p.end}" transform="translate(${p.cx},${p.cy})"><circle r="19"/><text class="number" y="1">${i+1}</text><text class="name" x="${p.id==='kuanzhai'?-29:29}" text-anchor="${p.id==='kuanzhai'?'end':'start'}" y="${i===0?-24:-2}">${p.name}</text><text class="time-label" x="${p.id==='kuanzhai'?-29:29}" text-anchor="${p.id==='kuanzhai'?'end':'start'}" y="21">${p.start}—${p.end}</text>${p.risk?`<text class="risk-label" x="${p.id==='kuanzhai'?-29:29}" text-anchor="${p.id==='kuanzhai'?'end':'start'}" y="42">${p.risk}</text>`:''}</g>`).join('')}</svg>`;document.querySelectorAll('[data-map-place]').forEach(el=>{el.onclick=()=>selectPlace(el.dataset.mapPlace);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPlace(el.dataset.mapPlace)}}});document.querySelectorAll('[data-map-segment]').forEach(el=>{el.onclick=()=>compare(Number(el.dataset.mapSegment));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();compare(Number(el.dataset.mapSegment))}}})}
function renderDetail(d){const p=d.places.find(p=>p.id===selected);$('#detail').innerHTML=`<div class="detail-title"><div class="eyebrow">地点详情 · 第 ${day+1} 天 / ${d.places.indexOf(p)+1}</div><h2>${p.name}</h2><div class="small">${p.type} · 示例地点信息</div></div><div class="detail-info"><div><h3>计划时段</h3><p class="mono">${p.start} — ${p.end}</p><span class="small">停留 ${p.duration} 分钟</span></div><div><h3>需要留意</h3><p>${p.id==='park'?'喝茶与散步，按自己的节奏。':p.name+' · 按计划安排游览。'}</p><span class="detail-note">${p.note}</span></div></div><div class="detail-actions"><button class="tool" data-demo="编辑${p.name}">编辑</button><button class="tool" data-demo="安排${p.name}预约">安排预约</button><button class="tool dark" data-demo="导航至${p.name}">去这里 ↗</button></div><div class="demo-label">示例行程 · 天气与交通为演示数据</div>`}
function compare(index){const d=data[day],s=d.segments[index],a=d.places[index],b=d.places[index+1];if(!s?.mode){openDialog(`<div class="dialog-kicker">交通比较 · 演示数据</div><h2>${a.name} → ${b.name}</h2><p>这段交通尚未查询。需主动查询后才能计算当天交通总时长。</p><div class="dialog-warning">当前草图不会发出网络请求，也不会补写虚构结果。</div><div class="dialog-buttons"><button class="tool light" data-demo="查询这段交通">主动查询 · 草图演示</button></div>`);return}openDialog(`<div class="dialog-kicker">交通比较 · 演示数据</div><h2>${a.name} → ${b.name}</h2><p>当前：${s.text}。以下方式仅演示比较与切换，非实时交通结果。</p><button class="mode-choice ${s.mode==='地铁'&&s.minutes===28?'current':''}" data-mode="地铁" data-minutes="28"><span>地铁${s.mode==='地铁'&&s.minutes===28?' · 当前':''}<small>示例 · 缓冲 ${s.buffer??15} 分钟</small></span><b>28 分</b></button><button class="mode-choice ${s.mode==='打车'&&s.minutes===18?'current':''}" data-mode="打车" data-minutes="18"><span>打车${s.mode==='打车'&&s.minutes===18?' · 当前':''}<small>示例 · 费用与路况需实际查询</small></span><b>18 分</b></button><div class="small">点击方式后仅修改本地草图，可撤销。其他计划时段保持不变。</div>`);document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{history.push(structuredClone(data));s.mode=el.dataset.mode;s.minutes=Number(el.dataset.minutes);s.text=`${s.mode} ${s.minutes} 分 · 缓冲 ${s.buffer??15} 分`;delete s.distance;d.meta=`已知交通 ${d.segments.reduce((n,t)=>n+(t.minutes||0),0)} 分 / ${d.segments.filter(t=>t.minutes!==null).length} 段${d.segments.some(t=>t.minutes===null)?' · 1 段未查询':''}`;d.walk=`${d.segments.filter(t=>t.distance).length?'已知步行 '+d.segments.filter(t=>t.distance).map(t=>t.distance).join(' + '):'已知步行距离未知'} · 交通切换后需复核`;closeDialog();render();showToast('交通方式已更新 · 可撤销')})}
function proposal(){openDialog(`<div class="dialog-kicker">AI / 天气候选 · 等待确认</div><h2>雨天，把室外留到另一日。</h2><p>第 1 天 14:00–17:00 有雨（演示）。候选为室内安排，交通与预约需复核。</p><div class="proposal-step"><time>第 1 天</time><div><h3>13:00–14:30 人民公园 → 成都博物馆</h3><small>新增室内候选；相关交通重新标记为未查询。</small></div></div><div class="proposal-step"><time>第 2 天</time><div><h3>移除重复的成都博物馆</h3><small>13:00–15:00 留白；不自动补景点。熊猫基地至太古里交通待查询。</small></div></div><div class="proposal-step"><time>第 3 天</time><div><h3>15:15–16:45 新增人民公园</h3><small>占用原返程留白，请确认返程；望平街至公园交通待查询。</small></div></div><div class="dialog-warning">仍未解决：博物馆 14:00 预约与候选 13:00 到达冲突；宽窄巷子仍受雨影响。确认仅保存草案，不代表预约或交通可用。</div><div class="dialog-buttons"><button class="tool" data-close>保留原路线</button><button id="confirm-proposal" class="tool accent">确认保存候选草案</button></div>`);$('#confirm-proposal').onclick=applyProposal}
function applyProposal(){if(data[0].adjusted){closeDialog();showToast('候选已保存，仍需复核预约与交通');return}history.push(structuredClone(data));const park=structuredClone(data[0].places.find(p=>p.id==='park')),museum=structuredClone(data[1].places.find(p=>p.id==='museum'));museum.start='13:00';museum.end='14:30';museum.duration=90;museum.x=60;museum.y=48;museum.risk='14:00 预约待复核';museum.note='雨天室内候选；14:00 预约与 13:00 到达仍冲突';data[0].places[2]=museum;data[0].segments[1]={text:'交通未查询 · 地点已调整',mode:null,minutes:null};data[0].meta='已知交通 8 分 / 1 段 · 2 段未查询';data[0].walk='已知步行 0.6 km · 候选待复核';data[0].adjusted=true;data[1].places=data[1].places.filter(p=>p.id!=='museum');data[1].segments=[{text:'交通未查询 · 已移除重复地点',mode:null,minutes:null}];data[1].meta='已知交通未知 · 1 段未查询';data[1].walk='13:00–15:00 留白 · 步行距离未知';park.start='15:15';park.end='16:45';park.x=70;park.y=83;park.note='新增候选占用返程留白；交通与返程需复核';park.risk='返程安排待确认';data[2].places.push(park);data[2].segments.push({text:'交通未查询 · 新增候选',mode:null,minutes:null});data[2].summary='09:30–16:45';data[2].meta='已知交通 35 分 / 1 段 · 1 段未查询';data[2].walk='已知步行距离未知 · 返程需复核';day=0;selected='museum';closeDialog();render();showToast('雨天候选已保存为草案 · 预约与交通待复核 · 可撤销')}
document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{day=Number(el.dataset.day);selected=data[day].places[0].id;render()});$('#weather-open').onclick=proposal;$('#ai-open').onclick=proposal;$('#undo').onclick=()=>{if(!history.length)return;data=history.pop();render();showToast('已撤销上一项调整，恢复原安排')};$('#collapse').onclick=()=>{collapsed=!collapsed;$('#float-body').hidden=collapsed;$('#collapse').textContent=collapsed?'展开 ＋':'收起 −';$('#collapse').setAttribute('aria-expanded',String(!collapsed))};render();
</script>
</body>
</html>
