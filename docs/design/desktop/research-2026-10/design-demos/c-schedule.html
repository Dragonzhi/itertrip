假设：用户已提取三日地点，正在检查交通占用、预约与天气；地图只提供路线关系上下文。
限制：纯离线桌面草图。时段来自共同 SPEC；天气、交通、预约均为演示数据，
路线示意并非地理比例或导航地图。候选应用只改变本页内存，刷新恢复；没有网络调用。
时间块采用统一 44.4px/小时；右侧独立交通轨道避免把短交通段夸大成一个景点。

function renderContext(){const d=days[activeDay-1],p=d.places.find(p=>p.id===selected)||d.places[0];selected=p.id;$('map-day').textContent=`第 ${activeDay} 天 · 路线关系`;const coords=d.places.map((_,i)=>({x:20+i*(244/Math.max(d.places.length-1,1)),y:i%2?53:29}));$('map').innerHTML=`<path class="route" d="${coords.map((c,i)=>(i?'L':'M')+c.x+' '+c.y).join(' ')}"/>`+d.places.map((p,i)=>`<g class="node ${p.id===selected?'active':''}" tabindex="0" role="button" aria-label="选择 ${p.name}" data-map-place="${p.id}"><circle cx="${coords[i].x}" cy="${coords[i].y}" r="11"/><text class="n" x="${coords[i].x}" y="${coords[i].y+4}" text-anchor="middle">${i+1}</text><text x="${coords[i].x}" y="${coords[i].y+28}" text-anchor="${i===0?'start':i===d.places.length-1?'end':'middle'}">${p.name}</text></g>`).join('');
 $('detail').innerHTML=`<div class="context-label"><span>选中地点 · 第 ${activeDay} 天</span><span>${p.kind} · 示例资料</span></div><h2 class="detail-title">${p.name}</h2><div class="detail-row nums">${p.start} 到达 — ${p.end} 离开 · ${minute(p.end)-minute(p.start)} 分</div><div class="detail-note">${p.risk||'地点信息仅用于布局与交互演示'}</div><div class="detail-actions"><button data-stub="编辑${p.name}">编辑地点</button><button data-stub="安排${p.name}预约">安排预约</button><button data-stub="导航到${p.name}">去这里 ↗</button></div>`;
 $('todo').innerHTML=`<div class="context-label">当天待确认</div><div class="todo-title">${d.day===1?applied?'调整后还要检查':'出门前，再确认两件事':d.day===2?'预约与计划，尚未对齐':'给返程留出余地'}</div>${d.day===1?`<button data-check="weather">${applied?'室内候选已应用 · 预约与交通待复核':'14–17 时有雨 · 看室内候选 ↗'}</button><button data-check="traffic">${applied?'新交通段未查询 ↗':'人民公园 → 宽窄巷子 · 交通未查询 ↗'}</button>`:d.day===2?`<button data-check="reservation">${applied?'博物馆已移走 · 原预约需要重约':'成都博物馆 · 14:00 预约冲突 ↗'}</button>`:'<button data-stub="查看返程安排">返程交通尚未录入 ↗</button>'}<button class="hotel" data-stub="确认酒店">${d.hotel} ↗</button>`;
 document.querySelectorAll('[data-map-place]').forEach(n=>{const go=()=>selectPlace(activeDay,n.dataset.mapPlace);n.onclick=go;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 document.querySelectorAll('[data-stub]').forEach(b=>b.onclick=()=>stub(b.dataset.stub));
 document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>b.dataset.check==='weather'?proposal('天气候选'):b.dataset.check==='traffic'?compare(applied?'new1':'unknown1'):stub('处理博物馆预约冲突'));
}
function modal(title,body,foot){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-foot').innerHTML=foot||'<button class="plain" data-close>知道了</button>';$('modal').showModal();$('modal-foot').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('modal').close());}
function stub(action){modal(action,`<div class="dialog-tag">草图演示</div><div class="stub-body">此入口展示「${escapeHtml(action)}」的位置。独立草图不连接正式编辑器、预约、导航或导出服务。</div><p class="small muted">可以体验：切换日期、选中地点、地图联动、交通比较，以及候选确认和撤销。</p>`)}
function compare(id){const t=days.flatMap(d=>d.transits).find(t=>t.id===id);if(!t)return;const known=t.minutes!==null;modal('交通方式比较',`<div class="dialog-tag">天气与交通为演示数据 · 不发起实时查询</div><p><b>${t.from}</b> → <b>${t.to}</b></p>${known?`<p class="small muted">这一段当前为 ${t.type} ${t.minutes} 分${t.buffer?'，另留 '+t.buffer+' 分缓冲':''}。</p>`:'<div class="callout">此段未查询，需要用户主动查询。下面仅演示比较的展示形式，不能用于出发判断。</div>'}<table class="comparison"><thead><tr><th>交通方式</th><th>路程时间</th><th>说明</th></tr></thead><tbody><tr class="${t.type==='地铁'?'current':''}"><td>地铁</td><td class="nums">28 分</td><td class="small">示例${t.type==='地铁'?' · 当前方式':''}</td></tr><tr><td>打车</td><td class="nums">18 分</td><td class="small">示例 · 比较候选</td></tr></tbody></table><p class="small muted">28 分 / 18 分是固定的比较示例，不覆盖本段已知原始耗时。选择其他方式需重新核对后续到达时间。</p>`,'<button class="plain" data-close>关闭比较</button><button class="primary" id="query-demo">主动查询（演示）</button>');$('query-demo').onclick=()=>{$('modal').close();stub('主动查询交通')};}
function proposal(source){modal(source+' · 先看影响',`<div class="dialog-tag">局部调整提案 · 示例行程 · 不调用 AI 或天气服务</div><p><b>第一天下午改为室内，人民公园移到第三天。</b></p><p class="small muted">触发原因：第 1 天 14:00–17:00 有雨，影响人民公园后半段与宽窄巷子。</p><div class="proposal-row"><b>第 1 天</b><div>13:00–14:30 成都博物馆<div class="small">替换人民公园。宽窄巷子仍为户外，雨天风险保留。</div></div></div><div class="proposal-row"><b>第 2 天</b><div>移除重复的成都博物馆<div class="small">原 13:00–15:00 留白；原预约不自动迁移或重约。</div></div></div><div class="proposal-row"><b>第 3 天</b><div>15:15–16:45 人民公园<div class="small">占用原返程留白，必须再确认返程安排。</div></div></div><div class="callout"><b>尚不可直接出发：</b>博物馆预约 14:00，候选仍计划 13:00 到达；所有改动相邻交通需重新查询。雨天候选：室内安排；交通与预约需复核。</div>`, `<button class="plain" data-close>保留原安排</button><button class="primary" id="apply-candidate" ${applied?'disabled':''}>${applied?'候选已应用':'确认演示调整'}</button>`);$('apply-candidate').onclick=applyCandidate;}
function applyCandidate(){if(applied)return;snapshot={days:structuredClone(days),activeDay,selected};const park=days[0].places.find(p=>p.id==='park'),museum=days[1].places.find(p=>p.id==='museum');days[0].places[2]={...museum,start:'13:00',end:'14:30',note:'90 分 · 预约需重约',risk:'预约 14:00 与候选 13:00 冲突，仍需复核'};days[1].places=days[1].places.filter(p=>p.id!=='museum');days[2].places.push({...park,start:'15:15',end:'16:45',note:'90 分 · 占用返程留白',risk:'交通与返程时间需复核'});days[0].transits=[days[0].transits[0],{id:'new1',start:'12:00',type:'需复核',minutes:null,buffer:0,from:'锦里',to:'成都博物馆'},{id:'new1b',start:'14:30',type:'需复核',minutes:null,buffer:0,from:'成都博物馆',to:'宽窄巷子'}];days[1].transits=[{id:'new2',start:'11:00',type:'需复核',minutes:null,buffer:0,from:'熊猫基地',to:'太古里'}];days[2].transits.push({id:'new3',start:'15:00',type:'需复核',minutes:null,buffer:0,from:'望平街',to:'人民公园'});days[0].summary='<b>09:00–17:00</b> · 已知交通 8 分 / 1 段 · 2 段需复核<br>步行 0.6 km · 预约与雨天风险仍待处理';days[1].summary='<b>08:30–17:00</b> · 原博物馆时段留白<br>新交通需复核 · 原预约需重约';days[2].summary='<b>09:30–16:45</b> · 原交通 35 分 / 1 段<br>新增交通未知 · 返程时间需复核';activeDay=1;selected='museum';applied=true;$('modal').close();render();toast('演示候选已应用。重复地点已移除，预约与交通仍需复核。');}
function undo(){if(!snapshot)return;days=snapshot.days;activeDay=snapshot.activeDay;selected=snapshot.selected;snapshot=null;applied=false;render();toast('已撤销：恢复三天原安排、交通与预约状态。')}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,5000)}
$('undo').onclick=undo;$('ai').onclick=()=>proposal('AI 候选');$('close-modal').onclick=()=>$('modal').close();$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const b=$('modal').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('modal').close()}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!$('modal').open){e.preventDefault();undo()}});render();
</script>
</body>
